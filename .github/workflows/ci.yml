name: Premier Backend CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premier-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: premier_test
          POSTGRES_USER: premier
          POSTGRES_PASSWORD: ci-synthetic-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U premier -d premier_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PostgreSQL backend tests and build
        run: |
          chmod +x mvnw
          bash tools/ci-backend.sh
      - name: Audit resolved dependency versions
        run: |
          ./mvnw --batch-mode --no-transfer-progress dependency:list -DoutputFile=target/dependencies.txt
          python3 tools/audit-maven.py
      - name: Build non-root runtime image
        run: docker build --pull --tag premier:${{ github.sha }} .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: premier:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Save release image identity
        run: docker image inspect premier:${{ github.sha }} --format '{{.Id}}' > target/container-image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-verification-${{ github.sha }}
          retention-days: 14
          path: |
            target/surefire-reports/
            target/maven-vulnerabilities.json
            target/dependencies.txt
            target/container-image-id.txt
            target/premier-*.jar
            ci-postgresql.log
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
