# Isolated in-memory database for automated tests. Never uses Render/Supabase credentials.
spring.datasource.url=jdbc:h2:mem:premier_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Tests do not need external services or production secrets.
ALLOWED_ORIGINS=http://localhost:3000
JWT_SECRET=test-only-secret-that-is-long-enough-to-be-safe-for-hmac-signing
JWT_ADMIN_SECRET=test-only-admin-secret-that-is-long-enough-for-hmac-signing
TOTP_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
PAYMONGO_SECRET_KEY=test-paymongo-secret
PAYMONGO_PUBLIC_KEY=test-paymongo-public-key
PAYMONGO_WEBHOOK_SECRET=test-paymongo-webhook-secret
DIALOGFLOW_PROJECT_ID=
