spring.application.name=Premier System
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# SUPABASE DIRECT CONNECTION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — default 3 is too low once GPS + admin polling run during active shifts
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Manila'
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Point-to-point cash fare snapshots used by no-balance staff RFID cards.
fare.fixed-amount=${FARE_FIXED_AMOUNT:60.00}
fare.discount-rate=${FARE_DISCOUNT_RATE:0.20}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
spring.jackson.time-zone=Asia/Manila

# DevTools is present (pom.xml). Disable automatic restart in shared/prod envs to avoid mid-request "Failed to fetch".
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}

# Passenger JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.temp-expiration=${JWT_TEMP_EXPIRATION:300000}

# Device-bound biometric refresh sessions (rolling expiration after successful use)
biometric.refresh-expiration-days=${BIOMETRIC_REFRESH_EXPIRATION_DAYS:30}


# Admin JWT
jwt.admin-secret=${JWT_ADMIN_SECRET}
jwt.admin-expiration=${JWT_ADMIN_EXPIRATION:86400000}

# Firebase
firebase.config-path=${FIREBASE_CONFIG_PATH:C:/Users/Jomar/eclipse-workspace/firebase-service-account.json}

# PayMongo
paymongo.secret-key=${PAYMONGO_SECRET_KEY}		
paymongo.public-key=${PAYMONGO_PUBLIC_KEY}
paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET}
paymongo.base-url=${PAYMONGO_BASE_URL:https://api.paymongo.com/v1}

# TOTP
totp.issuer=${TOTP_ISSUER:PremierTransit}
totp.encryption-key=${TOTP_ENCRYPTION_KEY}

dialogflow.project-id=${DIALOGFLOW_PROJECT_ID}
dialogflow.language-code=en
dialogflow.credentials-path=${DIALOGFLOW_CREDENTIALS_PATH:C:/Users/Jomar/eclipse-workspace/dialogflow-service-account.json}

# Gemini is used only to improve safe conversational support text.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Support ticket email via Brevo Transactional Email API
brevo.api-key=${BREVO_API_KEY:}
brevo.email.from-address=${BREVO_FROM_ADDRESS:}
brevo.email.from-name=${BREVO_FROM_NAME:Premier Transport Support}
brevo.email.timeout-seconds=${BREVO_EMAIL_TIMEOUT_SECONDS:15}

# QR fare tokens
fare.qr-expiration-seconds=${FARE_QR_EXPIRATION_SECONDS:60}
 
chatbot.rate-limit.requests-per-minute=20
management.endpoints.web.exposure.include=health
# Autoconfigure exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

ALLOWED_ORIGINS=https://premierusers.vercel.app,https://premierrfid.vercel.app,https://premierdriver.vercel.app,https://premieradmin.vercel.app,https://premier-staff.vercel.app
